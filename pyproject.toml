[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-lab-digital-twin"
version = "0.1.0"
description = "Module 3 of the Academic AI Compute Fabric: standalone simulated digital twin of a 32-node GPU lab."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mariana De La Cruz" }, { name = "Julian Motta" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "hypothesis>=6.100,<7",
    "jsonschema>=4.21,<5",
    "pyyaml>=6,<7",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:gpu_lab_twin.*",
    # Third-party: newer Starlette deprecates its httpx-based TestClient; not actionable in this codebase.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["gpu_lab_twin"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", "_bmad", "test", "planning"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
