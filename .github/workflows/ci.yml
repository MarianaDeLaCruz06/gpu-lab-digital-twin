name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gpu_lab_twin_test
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twin -d gpu_lab_twin_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests migrations
          ruff format --check src tests migrations
      - name: Test (SQLite, with coverage)
        run: pytest --cov --cov-report=term-missing
      - name: Test (PostgreSQL 17)
        env:
          GPU_TWIN_TEST_DATABASE_URL: postgresql+psycopg://twin:twin@localhost:5432/gpu_lab_twin_test
        run: pytest -q
      - name: Migrate PostgreSQL from scratch
        env:
          GPU_TWIN_DATABASE_URL: postgresql+psycopg://twin:twin@localhost:5432/gpu_lab_twin_test
        run: |
          psql postgresql://twin:twin@localhost:5432/gpu_lab_twin_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic downgrade base
